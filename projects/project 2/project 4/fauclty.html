<!DOCTYPE html>
<html>
<head>
    <title>Faculty Timetable</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 20px;
        }

        h2 {
            color: #333;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
            background-color: white;
        }

        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #ddd;
        }
    </style>
</head>
<body>

<h2>Click Faculty Name to View Timetable</h2>

<button onclick="showBindhu()">ms.Bindhu mam</button>
<button onclick="showUma()">ms.Uma mam</button>
<button onclick="showSamatha()">Ms.Samatha mam</button>

<div id="timetable"></div>

<script>
    function showBindhu() {
        document.getElementById("timetable").innerHTML = `
        <h3>ms.Bindhu mam – Timetable</h3>
        <table>
            <tr>
                <th>Day</th>
                <th>9:10-10:10</th>
                <th>2:00-3:00</th>
            
            </tr>
            <tr>
                <td>Monday</td>
                <td>dbms</td>
                
            </tr>
            <tr>
                <td>wednesday</td>
                <td></td>
                <td>dbms</td>
                
            </tr>
        </table>`;
    }

    function showUma() {
        document.getElementById("timetable").innerHTML = `
        <h3>ms.Uma mam– Timetable</h3>
        <table>
            <tr>
                <th>Day</th>
                <th>12:20-1:20</th>
                <th>3:00-4:00</th>
                
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>dlco</td>
                
            </tr>
            <tr>
                <td>Thursday</td>
                <td></td>
                <td>dlco</td>
                
            </tr>
        </table>`;
    }

    function showSamatha() {
        document.getElementById("timetable").innerHTML = `
        <h3>Ms.Samatha mam– Timetable</h3>
        <table>
            <tr>
                <th>Day</th>
                <th>9:10-10:10</th>
                <th>10:10-11:10</th>
                
            </tr>
            <tr>
                <td>Friday</td>
                <td>ml</td>
                
            </tr>
            <tr>
                <td>Saturday</td>
                <td></td>
                <td>ml</td>
                
            </tr>
        </table>`;
    }
</script>

</body>
</html>
