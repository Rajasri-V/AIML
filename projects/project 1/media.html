<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Media Gallery</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      padding: 25px;
    }
    h1 {
      text-align: center;
      color: #4a90e2;
      border-bottom: 3px solid #4a90e2;
      padding-bottom: 10px;
      margin-bottom: 30px;
    }
    .gallery-section {
      margin-bottom: 40px;
      padding: 20px;
      background-color: #f9f9f9;
      border: 2px solid #dbeafe;
      border-radius: 10px;
    }
    h2 {
      color: #2c5282;
      margin-bottom: 15px;
      text-align: center;
    }

    /* Image Gallery */
    .image-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }
    .image-item {
      width: 200px;
      border: 3px solid #a0aec0;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
    }
    .image-item img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }
    .image-item p {
      text-align: center;
      margin: 5px 0 10px;
      color: #4a5568;
      font-size: 0.9em;
    }

    /* Audio Gallery */
    .audio-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .audio-item {
      text-align: center;
      padding: 15px;
      background: #e0f2fe;
      border: 2px dashed #90cdf4;
      border-radius: 8px;
      width: 250px;
    }
    .audio-item audio {
      width: 100%;
    }
    .audio-item h3 {
      margin: 10px 0 5px;
      color: #2b6cb0;
    }

    /* Video Gallery */
    .video-gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .video-item {
      width: 300px;
      border: 2px solid #3182ce;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }
    .video-item video {
      width: 100%;
    }
    .video-item h3 {
      text-align: center;
      margin: 10px 0 5px;
      color: #2c5282;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Media Gallery</h1>

    <!-- Image Gallery -->
    <section class="gallery-section">
      <h2>🖼️ Images</h2>
      <div class="image-gallery">
        <div class="image-item">
          <img src="images (1).jfif" width="200">
          <p>Photo 1</p>
        </div>
        <div class="image-item">
          <img src="https://via.placeholder.com/200x150/e74c3c/ffffff?text=Image+2" alt="Sample Image 2" />
          <p>Photo 2</p>
        </div>
        <div class="image-item">
          <img src="https://via.placeholder.com/200x150/27ae60/ffffff?text=Image+3" alt="Sample Image 3" />
          <p>Photo 3</p>
        </div>
      </div>
    </section>

    <!-- Audio Gallery -->
    <section class="gallery-section">
      <h2>🎧 Audio Clips</h2>
      <div class="audio-gallery">
        <div class="audio-item">
          <h3>Music 1</h3>
          <audio controls>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
          </audio>
        </div>
        <div class="audio-item">
          <h3>Music 2</h3>
          <audio controls>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
          </audio>
        </div>
      </div>
    </section>

    <!-- Video Gallery -->
    <section class="gallery-section">
      <h2>🎥 Videos</h2>
      <div class="video-gallery">
        <div class="video-item">
          <video controls height="200" poster="https://via.placeholder.com/300x200/2c3e50/ffffff?text=Video+1">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          <h3>Sample Video 1</h3>
        </div>
        <div class="video-item">
          <video controls height="200" poster="https://via.placeholder.com/300x200/8e44ad/ffffff?text=Video+2">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          <h3>Sample Video 2</h3>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
